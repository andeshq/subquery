services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      # The fixture schema is shared with the Go tests, which embed it.
      - ../../test/dbtest/fixtures:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 2s
      timeout: 2s
      retries: 20

  subquery:
    build:
      context: ../..
      dockerfile: Dockerfile
    environment:
      PGRST_DB_URI: postgres://authenticator:secret@db:5432/app
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_LOG_LEVEL: info
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  # The reference implementation, used by the conformance harness as the
  # oracle. Run with: docker compose up -d postgrest
  postgrest:
    image: postgrest/postgrest:latest
    environment:
      PGRST_DB_URI: postgres://authenticator:secret@db:5432/app
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: reallyreallyreallyreallyverysafe!
      PGRST_DB_AGGREGATES_ENABLED: "true"
      PGRST_SERVER_PORT: "3101"
    ports:
      - "3101:3101"
    depends_on:
      db:
        condition: service_healthy
